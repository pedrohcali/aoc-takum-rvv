[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aoc-takum-rvv"
version = "0.1.0"
description = "Exact functional model of linear Takum arithmetic for the UFMG AOC project"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
takum = "takum.cli:main"

[tool.setuptools.packages.find]
include = ["takum*"]
